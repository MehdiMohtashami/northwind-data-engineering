networks:
  nw_de_net:
    name: nw_de_net

volumes:
  sqlserver_data:
  postgres_staging_data:
  clickhouse_data:
  postgres_airflow_data:
  spark_data:
  grafana_data:
  minio_data:
  elasticsearch_data:
  mongo_data:

x-airflow-common: &airflow-common
  build:
    context: ./airflow
    dockerfile: Dockerfile
  image: nw_de/airflow:2.8.1-mssql-pg-ch
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres_airflow/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/logs:/opt/airflow/logs
    - ./spark:/opt/airflow/spark
  networks:
    - nw_de_net
  depends_on:
    postgres_airflow:
      condition: service_healthy

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: nw_de_sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Developer
      MSSQL_AGENT_ENABLED: "true"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./infra/sqlserver/init:/docker-entrypoint-initdb.d
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -N -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - nw_de_net

  postgres_staging:
    image: postgres:16
    container_name: nw_de_postgres_staging
    environment:
      POSTGRES_DB: ${PG_STAGING_DB}
      POSTGRES_USER: ${PG_STAGING_USER}
      POSTGRES_PASSWORD: ${PG_STAGING_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${PG_STAGING_USER} -d $${PG_STAGING_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - nw_de_net

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: nw_de_clickhouse
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./infra/clickhouse/init:/docker-entrypoint-initdb.d
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - nw_de_net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: nw_de_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - nw_de_net

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: nw_de_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - nw_de_net

  postgres_airflow:
    image: postgres:16
    container_name: nw_de_postgres_airflow
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - postgres_airflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - nw_de_net

  airflow-init:
    <<: *airflow-common
    container_name: nw_de_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create --username admin --password admin --firstname Admin --lastname Admin --role Admin --email admin@example.com || true

  airflow-webserver:
    <<: *airflow-common
    container_name: nw_de_airflow_webserver
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      postgres_airflow:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    <<: *airflow-common
    container_name: nw_de_airflow_scheduler
    command: scheduler
    depends_on:
      postgres_airflow:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  spark:
    image: bitnamilegacy/spark:3.5
    container_name: nw_de_spark_master
    environment:
      SPARK_MODE: master
    ports:
      - "7077:7077"
      - "8081:8080"
    volumes:
      - ./spark:/opt/bitnami/spark/work-dir
      - spark_data:/bitnami
    networks:
      - nw_de_net

  spark-worker:
    image: bitnamilegacy/spark:3.5
    container_name: nw_de_spark_worker
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark:7077
    volumes:
      - ./spark:/opt/bitnami/spark/work-dir
    depends_on:
      - spark
    networks:
      - nw_de_net

  grafana:
    image: grafana/grafana:11.0.0
    container_name: nw_de_grafana
    environment:
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - nw_de_net

  producer:
    build:
      context: ./streaming/producer
    container_name: nw_de_producer
    environment:
      MSSQL_HOST: sqlserver
      MSSQL_PORT: "1433"
      MSSQL_DB: Northwind
      MSSQL_USER: sa
      MSSQL_PASSWORD: ${MSSQL_SA_PASSWORD}
      KAFKA_BOOTSTRAP: kafka:29092
      POLL_INTERVAL_SECONDS: "2.5"
    depends_on:
      - kafka
      - sqlserver
    networks:
      - nw_de_net

  consumer:
    build:
      context: ./streaming/consumer
    container_name: nw_de_consumer
    environment:
      MSSQL_HOST: sqlserver
      MSSQL_PORT: "1433"
      MSSQL_DB: Northwind
      MSSQL_USER: sa
      MSSQL_PASSWORD: ${MSSQL_SA_PASSWORD}
      CH_HOST: clickhouse
      CH_PORT: "8123"
      CH_USER: default
      CH_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CH_DATABASE: NorthwindDW
      KAFKA_BOOTSTRAP: kafka:29092
      KAFKA_GROUP_ID: nw-cdc-consumer
      MONGO_HOST: mongodb
      MONGO_PORT: "27017"
      MONGO_USER: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      ES_URL: http://elasticsearch:9200
    depends_on:
      - kafka
      - sqlserver
      - clickhouse
      - mongodb
      - elasticsearch
    networks:
      - nw_de_net

  minio:
    image: minio/minio:latest
    container_name: nw_de_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - nw_de_net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELK_VERSION}
    container_name: nw_de_elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - nw_de_net

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELK_VERSION}
    container_name: nw_de_kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - nw_de_net

  mongodb:
    image: mongo:7
    container_name: nw_de_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      - nw_de_net

  logstash:
    image: docker.elastic.co/logstash/logstash:${ELK_VERSION}
    container_name: nw_de_logstash
    environment:
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"
      XPACK_MONITORING_ENABLED: "false"
    volumes:
      - ./infra/logstash/pipeline:/usr/share/logstash/pipeline:ro
    ports:
      - "5044:5044"
      - "9600:9600"
    depends_on:
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      # curl against the (SSL-disabled) monitoring API on :9600 consistently
      # returns an empty reply in this environment despite the pipeline
      # itself working correctly (confirmed via ES doc counts) -- a
      # curl/netty quirk, not an actual outage. Nothing downstream depends
      # on this healthcheck, so check the JVM process is alive instead.
      test: ["CMD-SHELL", "pgrep -f logstash || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - nw_de_net

  filebeat:
    image: docker.elastic.co/beats/filebeat:${ELK_VERSION}
    container_name: nw_de_filebeat
    user: root
    command: ["--strict.perms=false"]
    volumes:
      - ./infra/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - nw_de_net

  packetbeat:
    image: docker.elastic.co/beats/packetbeat:${ELK_VERSION}
    container_name: nw_de_packetbeat
    user: root
    cap_add:
      - NET_ADMIN
      - NET_RAW
    network_mode: host
    command: ["--strict.perms=false"]
    volumes:
      - ./infra/packetbeat/packetbeat.yml:/usr/share/packetbeat/packetbeat.yml:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
