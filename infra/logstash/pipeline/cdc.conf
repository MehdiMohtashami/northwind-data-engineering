# Phase 6B: mirrors the same CDC events the Python consumer applies to
# ClickHouse (Decision: consumer -> Mongo is the durable event log; this
# path is Kafka -> Logstash -> Elasticsearch for search/visualization --
# same source topics, read independently via its own consumer group, so
# neither path can block or slow down the other).
input {
  kafka {
    bootstrap_servers => "kafka:29092"
    topics => ["nw.cdc.orders", "nw.cdc.order_details"]
    group_id => "logstash-cdc-monitoring"
    auto_offset_reset => "earliest"
    codec => json
  }
}

filter {
  date {
    match => ["ts", "ISO8601"]
    target => "@timestamp"
  }

  mutate {
    add_field => { "order_id" => "%{[after][OrderID]}" }
  }

  if [after][ProductID] {
    mutate {
      add_field => { "product_id" => "%{[after][ProductID]}" }
    }
  }

  mutate {
    convert => {
      "order_id" => "integer"
      "product_id" => "integer"
    }
  }

  ruby {
    code => "event.set('latency_ms', ((Time.now.to_f - event.get('@timestamp').to_f) * 1000.0).round(2))"
  }

  mutate {
    remove_field => ["@version"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "nw-cdc-events-%{+YYYY.MM.dd}"
  }
}
